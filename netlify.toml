[build]
  functions = "server"
  publish = "client"
  command = "npm install && (cd prisma && npx prisma generate && npx prisma migrate deploy)"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  
[[redirects]]
  from = "/user/*"
  to = "/user.html"
  status = 200
