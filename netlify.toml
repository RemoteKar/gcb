[build]
  functions = "server"
  publish = "client"
  command = "npm install && node node_modules/prisma/build/index.js generate --schema=./prisma/schema.prisma && node node_modules/prisma/build/index.js migrate deploy --schema=./prisma/schema.prisma && node scripts/build-static-data.js && node scripts/build-patchnotes.js && node scripts/build-leaderboard.js"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  
# /user/닉네임 → 서버 함수가 user.html에 OG 태그를 끼워서 응답 (링크 미리보기용)
[[redirects]]
  from = "/user/*"
  to = "/.netlify/functions/server/user/:splat"
  status = 200

[[redirects]]
  from = "/character/:id"
  to = "/character_detail.html"
  status = 200

[[redirects]]
  from = "/weapon/:id"
  to = "/weapon_detail.html"
  status = 200

[[redirects]]
  from = "/titan/:skillId/:titanName"
  to = "/titan_detail.html"
  status = 200

[[redirects]]
  from = "/titan/:skillId"
  to = "/titan_list.html"
  status = 200
