[build]
  functions = "server"
  publish = "client"
  command = "npm install && npx prisma generate --schema=./prisma/schema.prisma && npx prisma migrate deploy --schema=./prisma/schema.prisma"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  
[[redirects]]
  from = "/user/*"
  to = "/user.html"
  status = 200
