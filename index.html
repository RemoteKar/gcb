<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCB.gg</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="header-bar"></div>
  <div class="container">
    <!-- 유저 검색 섹션 -->
    <section id="user-search" class="section active">
      <h1>유저 검색</h1>
      <div class="search-box">
        <!-- 닉네임 또는 UUID 입력 -->
        <input type="text" id="nickname" placeholder="마크 닉네임 또는 UUID를 입력하세요">
        <button id="search-button">검색</button>
      </div>
      <p id="result"></p>
      <!-- 플레이어 머리 이미지 영역 -->
      <div id="player-head" class="player-head"></div>
      <!-- 게임 기록 표시 영역 -->
      <div class="info-card">
        <h2>🎮 게임 기록</h2>
        <div id="game-history"></div>
      </div>
    </section>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
