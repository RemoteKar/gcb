<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCB.gg</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header-bar"></div>

  <div class="container">
    <!-- 유저 검색 -->
    <section id="user-search" class="section active">
      <h1>유저 검색</h1>
      <div class="search-box">
        <input type="text" id="nickname" placeholder="마크 닉네임을 입력하세요" />
        <button id="search-button">검색</button>
      </div>
      <p id="result"></p>

      <div id="player-head" class="player-head"></div> <!-- 플레이어 머리 -->

      <div class="info-card">
        <h2>🎖 배지 정보</h2>
        <div id="badge-display"></div>
      </div>

      <div class="info-card">
        <h2>📊 통계 정보</h2>
        <div id="stats-display"></div>
      </div>
    </section>
  </div>

  <!-- 스크립트 -->
  <script src="skript.js"></script>
</body>
</html>
