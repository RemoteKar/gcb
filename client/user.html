<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCB.gg - 유저 프로필</title>
  <!--OG-->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <script src="/scripts/character-config.js"></script>
  <script src="/scripts/common.js"></script>
  <main class="page">
    <section class="card profile" id="profile"><div class="skeleton row"></div></section>

    <div class="user-layout" id="user-layout" hidden>
      <aside class="user-side">
        <section class="card" id="summary-card"></section>
        <section class="card" id="style-card"></section>
        <section class="card" id="prefs-card"></section>
        <section class="card" id="people-card"></section>
        <section class="card" id="wins-card"></section>
      </aside>
      <div class="user-main">
        <section class="card" id="form-card"></section>
        <section class="card">
          <div class="card-head">
            <div class="tabs" id="user-tabs" role="tablist">
              <button data-period="games" class="active">전적</button>
              <button data-period="characters">캐릭터별</button>
            </div>
          </div>
          <div id="tab-games">
            <div class="game-list" id="game-list"></div>
            <button class="btn btn-ghost load-more" id="load-more" hidden>더보기</button>
          </div>
          <div id="tab-characters" class="table-wrap" hidden></div>
        </section>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="game-modal" style="display:none">
    <div class="modal game-modal" role="dialog" aria-modal="true">
      <button class="modal-close" aria-label="닫기">&times;</button>
      <div id="game-modal-body"></div>
    </div>
  </div>

  <script src="/scripts/stats-table.js"></script>
  <script src="/scripts/augment_popup.js"></script>
  <script type="module" src="/scripts/user.js"></script>
</body>
</html>
