<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCB.gg - 유저 프로필</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="header-bar">
    <a href="/" class="header-logo">GCB.GG</a>
    <a href="/ranking.html" class="nav-button">랭킹</a>
    <a href="/character.html" class="nav-button">캐릭터정보</a>
    <a href="/augment.html" class="nav-button">증강정보</a>
    <a href="/character_stats.html" class="nav-button">캐릭터 통계</a>
    <a href="/augment_stats.html" class="nav-button">증강 통계</a>
    <a href="/feedback.html" class="nav-button nav-button-red">건의/버그</a>
  </div>
  <!-- 최상위 래퍼 -->
  <div class="wrapper">
    <!-- 왼쪽 영역 -->
    <div class="left-panel">
      <!-- 검색 섹션 (원한다면 숨기거나 유지) -->
      <section id="user-search" class="section active">
        <h1>GCB.GG</h1>
        <div class="search-box">
            <input type="text" id="nickname" placeholder="닉네임을 입력하세요">
            <button id="search-button">검색</button>
        </div>
      </section>

      <!-- 유저 정보 표시 -->
      <h2 id="user-title"></h2>
      <div id="player-head" class="player-head"></div>
      <div id="badge-display" class="badge-display"></div>
      <div id="stats-display" class="stats-display"></div>
    </div>

    <!-- 오른쪽 영역: 게임 리스트 -->
    <div class="right-panel">
      <div id="gameList" class="game-list"></div>
      <button id="loadMoreButton" class="load-more-btn">더보기</button>
    </div>
  </div>

  <!-- 게임 상세 모달 -->
  <div id="gameDetailModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="modalPlayerList" class="modal-player-list"></div>
    </div>
  </div>

  <script src="/scripts/character-config.js"></script>
  <script src="/scripts/augment_popup.js"></script>
  <script type="module" src="/scripts/user.js"></script>
</body>
</html>
