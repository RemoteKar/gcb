<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캐릭터 정보 - GCB.gg</title>
  <meta property="og:title" content="캐릭터 정보 - GCB.gg">
  <meta property="og:description" content="게임캐릭터배틀 캐릭터 스탯·스킬·실전 통계">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <script src="/scripts/character-config.js"></script>
  <script src="/scripts/common.js"></script>
  <main class="page">
    <section class="card char-hero" id="char-hero"><div class="skeleton row"></div><div class="skeleton row"></div></section>

    <div class="char-layout" id="char-layout" hidden>
      <div class="char-main">
        <section class="card" id="skills-card"></section>
        <section class="card">
          <div class="card-head"><h2>댓글 <small id="comment-total"></small></h2></div>
          <form id="comment-form" class="comment-form">
            <div class="comment-form-row">
              <input type="text" id="comment-nickname" class="input" placeholder="닉네임 (비우면 ㅇㅇ)" maxlength="15" aria-label="닉네임">
              <input type="password" id="comment-password" class="input" placeholder="비밀번호 (영문/숫자 4자)" maxlength="4" pattern="[a-zA-Z0-9]{4}" required aria-label="비밀번호">
            </div>
            <textarea id="comment-content" class="input" placeholder="내용 (300자 이내)" maxlength="300" required aria-label="댓글 내용"></textarea>
            <div class="comment-form-footer">
              <span id="comment-error" class="form-error"></span>
              <span id="comment-count" class="comment-count">0 / 300</span>
              <button type="submit" id="comment-submit" class="btn btn-primary">작성</button>
            </div>
          </form>
          <div id="comments-list"></div>
          <div id="comments-pager" class="pager"></div>
        </section>
      </div>
      <aside class="char-side">
        <section class="card" id="live-card"></section>
        <section class="card" id="style-card"></section>
        <section class="card" id="mains-card"></section>
      </aside>
    </div>
  </main>
  <script src="/scripts/augment_popup.js"></script>
  <script type="module" src="/scripts/character_detail.js"></script>
</body>
</html>
