<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건의/버그 - GCB.gg</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <script src="/scripts/character-config.js"></script>
    <script src="/scripts/common.js"></script>
    <main class="page page-narrow">
        <div class="page-head">
            <h1 class="page-title">건의/버그</h1>
            <button id="write-btn" class="btn btn-primary">작성하기</button>
        </div>
        <section class="card">
            <div class="card-head">
                <div class="tabs tabs-sm status-tabs" role="tablist" aria-label="상태">
                    <button class="active" data-status="open">열림 <span class="tab-count"></span></button>
                    <button data-status="resolved">해결 <span class="tab-count"></span></button>
                    <button data-status="closed">닫힘 <span class="tab-count"></span></button>
                </div>
                <div class="tabs tabs-sm filter-buttons" role="tablist" aria-label="카테고리">
                    <button class="active" data-filter="all">전체</button>
                    <button data-filter="bug">버그</button>
                    <button data-filter="enhancement">건의</button>
                    <button data-filter="other">기타</button>
                    <button data-filter="gcbc">GCBC</button>
                </div>
            </div>
            <div id="feedback-list" class="feedback-list"><div class="skeleton row"></div><div class="skeleton row"></div><div class="skeleton row"></div></div>
            <div id="pagination" class="pager"></div>
            <div class="feedback-admin-row"><button id="admin-btn" class="btn btn-xs btn-ghost">관리자</button></div>
        </section>
    </main>

    <!-- 상세 팝업 -->
    <div id="detail-popup" class="modal-overlay" style="display:none;">
        <div class="modal feedback-detail" role="dialog" aria-modal="true">
            <button class="modal-close" id="detail-popup-close" aria-label="닫기">&times;</button>
            <div class="feedback-detail-header">
                <span id="detail-label" class="feedback-label"></span>
                <span id="detail-status" class="feedback-label"></span>
                <span id="detail-date"></span>
            </div>
            <h2 id="detail-title" class="feedback-detail-title"></h2>
            <div id="detail-body" class="feedback-detail-body"></div>
            <div class="feedback-detail-author">
                <span id="detail-author"></span>
                <span id="detail-admin" class="feedback-admin" hidden>
                    <button class="btn btn-xs" data-status="open">다시 열기</button>
                    <button class="btn btn-xs" data-status="resolved">해결</button>
                    <button class="btn btn-xs" data-status="closed">닫음</button>
                </span>
                <button id="detail-delete" class="btn btn-xs btn-ghost">삭제</button>
            </div>
        </div>
    </div>

    <!-- 작성 팝업 -->
    <div id="write-popup" class="modal-overlay" style="display:none;">
        <div class="modal" role="dialog" aria-modal="true">
            <button class="modal-close" id="write-popup-close" aria-label="닫기">&times;</button>
            <h2 class="modal-title">건의/버그 작성</h2>
            <form id="feedback-form" class="feedback-form">
                <div class="feedback-field">
                    <label for="feedback-nickname">작성자</label>
                    <div class="feedback-author-row">
                        <input type="text" id="feedback-nickname" class="input"
                               placeholder="닉네임 (비우면 ㅇㅇ)" maxlength="15">
                        <input type="password" id="feedback-password" class="input"
                               placeholder="비밀번호 (영문/숫자 4자)" maxlength="4" pattern="[a-zA-Z0-9]{4}" required>
                    </div>
                </div>
                <div class="feedback-field">
                    <label for="feedback-category">카테고리</label>
                    <select id="feedback-category" class="input">
                        <option value="bug">버그</option>
                        <option value="enhancement">건의</option>
                        <option value="other">기타</option>
                        <option value="gcbc">GCBC</option>
                    </select>
                </div>
                <div class="feedback-field">
                    <label for="feedback-title">제목</label>
                    <input type="text" id="feedback-title" class="input"
                           placeholder="제목을 입력하세요" maxlength="100" required>
                </div>
                <div class="feedback-field">
                    <label for="feedback-content">내용</label>
                    <textarea id="feedback-content" class="input"
                              placeholder="내용을 입력하세요" maxlength="2000" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary feedback-submit-btn">제출</button>
            </form>
            <p id="feedback-status"></p>
        </div>
    </div>

    <script src="/scripts/feedback.js"></script>
</body>
</html>
