<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건의/버그 - GCB.gg</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="header-bar">
      <a href="/" class="header-logo">GCB.GG</a>
      <a href="/ranking.html" class="nav-button">랭킹</a>
      <a href="/character.html" class="nav-button">캐릭터</a>
      <a href="/augment.html" class="nav-button">증강</a>
      <a href="/patchnotes.html" class="nav-button">패치노트</a>
      <a href="/feedback.html" class="nav-button nav-button-red active">건의/버그</a>
    </div>

    <div class="container feedback-container">
        <!-- 상단: 타이틀 + 필터 -->
        <div class="feedback-top-bar">
            <h1>건의/버그</h1>
            <div class="filter-buttons">
                <button class="stat-button active" data-filter="all">전체</button>
                <button class="stat-button" data-filter="bug">버그</button>
                <button class="stat-button" data-filter="enhancement">건의</button>
                <button class="stat-button" data-filter="other">기타</button>
                <button class="stat-button" data-filter="gcbc">GCBC</button>
            </div>
        </div>

        <!-- 목록 -->
        <div id="feedback-list" class="feedback-list">
            <p class="loading-text">로딩 중...</p>
        </div>

        <!-- 페이지네이션 -->
        <div id="pagination" class="feedback-pagination"></div>

        <!-- 작성하기 버튼 (하단) -->
        <button id="write-btn" class="feedback-write-btn">작성하기</button>
    </div>

    <!-- 로그인 팝업 -->
    <div id="login-popup" class="modal-overlay" style="display:none;">
        <div class="feedback-login-card">
            <button class="modal-close" id="login-popup-close">&times;</button>
            <h2>로그인이 필요합니다</h2>
            <p class="feedback-login-desc">건의/버그를 작성하려면 먼저 로그인해주세요.</p>
            <div class="feedback-login-buttons">
                <button id="github-signin-btn" class="feedback-github-btn">
                    <svg width="20" height="20" viewBox="0 0 16 16" fill="white">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    GitHub으로 로그인
                </button>
            </div>
        </div>
    </div>

    <!-- 상세 팝업 -->
    <div id="detail-popup" class="modal-overlay" style="display:none;">
        <div class="feedback-detail-card">
            <button class="modal-close" id="detail-popup-close">&times;</button>
            <div class="feedback-detail-header">
                <span id="detail-label" class="feedback-label"></span>
                <span id="detail-date" class="feedback-detail-date"></span>
            </div>
            <h2 id="detail-title" class="feedback-detail-title"></h2>
            <div id="detail-body" class="feedback-detail-body"></div>
            <div id="detail-author" class="feedback-detail-author"></div>
        </div>
    </div>

    <!-- 작성 팝업 -->
    <div id="write-popup" class="modal-overlay" style="display:none;">
        <div class="feedback-write-card">
            <button class="modal-close" id="write-popup-close">&times;</button>
            <div class="feedback-write-header">
                <h2>건의/버그 작성</h2>
                <div id="user-info" class="feedback-user-info">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="feedback-logout-btn">로그아웃</button>
                </div>
            </div>
            <form id="feedback-form" class="feedback-form">
                <div class="feedback-field">
                    <label for="feedback-category">카테고리</label>
                    <select id="feedback-category" class="feedback-select">
                        <option value="bug">버그</option>
                        <option value="enhancement">건의</option>
                        <option value="other">기타</option>
                        <option value="gcbc">GCBC</option>
                    </select>
                </div>
                <div class="feedback-field">
                    <label for="feedback-title">제목</label>
                    <input type="text" id="feedback-title" class="feedback-input"
                           placeholder="제목을 입력하세요" maxlength="100" required>
                </div>
                <div class="feedback-field">
                    <label for="feedback-content">내용</label>
                    <textarea id="feedback-content" class="feedback-textarea"
                              placeholder="내용을 입력하세요" maxlength="2000" required></textarea>
                </div>
                <button type="submit" class="feedback-submit-btn">제출</button>
            </form>
            <p id="feedback-status"></p>
        </div>
    </div>

    <script src="/scripts/feedback.js"></script>
</body>
</html>
