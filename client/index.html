<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCB.gg - 게임캐릭터배틀 전적 검색</title>
  <meta name="description" content="게임캐릭터배틀(GCB) 유저 전적, 캐릭터·증강 통계, 랭킹">
  <meta property="og:title" content="GCB.gg - 게임캐릭터배틀 전적 검색">
  <meta property="og:description" content="유저 전적 · 캐릭터/증강 통계 · 랭킹">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <script src="/scripts/character-config.js"></script>
  <script src="/scripts/common.js"></script>
  <main class="page">
    <section class="hero">
      <h1 class="hero-logo">GCB<span>.GG</span></h1>
      <p class="hero-tagline">게임캐릭터배틀 전적 · 통계 · 랭킹</p>
      <form class="hero-search" data-user-search role="search">
        <input type="search" name="q" placeholder="닉네임을 입력하세요" autocomplete="off" aria-label="닉네임">
        <button type="submit" class="btn btn-primary">검색</button>
      </form>
      <div class="hero-stats" id="hero-stats"></div>
    </section>

    <!-- 테스트 서버가 열려 있을 때만 표시 -->
    <a href="/testserver.html" id="ts-banner" class="ts-banner" hidden>
      <span class="ts-banner-dot"></span>
      <span class="ts-banner-text">테스트 서버 <b>열림</b></span>
      <span class="ts-banner-players" id="ts-banner-players"></span>
      <span class="ts-banner-heads" id="ts-banner-heads"></span>
      <span class="ts-banner-go">보기 →</span>
    </a>

    <div class="home-grid">
      <section class="card">
        <div class="card-head"><h2>최근 게임</h2><a href="/character_stats.html">캐릭터 통계 →</a></div>
        <div class="list" id="home-recent-games"><div class="skeleton row"></div><div class="skeleton row"></div><div class="skeleton row"></div></div>
      </section>
      <div class="stack-col">
        <section class="card">
          <div class="card-head"><h2>랭킹 TOP 5</h2><a href="/ranking.html">전체 랭킹 →</a></div>
          <div class="list" id="home-top-players"><div class="skeleton row"></div><div class="skeleton row"></div></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>승리 캐릭터 <small>최근 60게임</small></h2><a href="/character_stats.html">더보기 →</a></div>
          <div class="list" id="home-top-characters"><div class="skeleton row"></div><div class="skeleton row"></div></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>인기 증강 <small>최근 60게임</small></h2><a href="/augment_stats.html">더보기 →</a></div>
          <div class="list" id="home-top-augments"><div class="skeleton row"></div><div class="skeleton row"></div></div>
        </section>
      </div>
    </div>
  </main>
  <script src="/scripts/augment_popup.js"></script>
  <script type="module" src="/scripts/main.js"></script>
</body>
</html>
