<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>패치노트 - GCB.gg</title>
  <meta property="og:title" content="패치노트 - GCB.gg">
  <meta property="og:description" content="게임캐릭터배틀 캐릭터·증강 밸런스 패치노트">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <script src="/scripts/character-config.js"></script>
  <script src="/scripts/common.js"></script>
  <main class="page page-narrow">
    <div class="page-head">
      <h1 class="page-title">패치노트</h1>
      <input type="search" id="pn-search" class="input" placeholder="검색 (캐릭터, 스킬, 날짜)" autocomplete="off" aria-label="패치노트 검색">
    </div>
    <div class="board">
      <div class="board-head"><span class="board-no">번호</span><span>제목</span><span class="board-date">날짜</span></div>
      <div id="pn-list"><div class="skeleton row"></div><div class="skeleton row"></div><div class="skeleton row"></div></div>
    </div>
    <button id="pn-more" class="btn btn-ghost load-more" hidden>더보기</button>
  </main>
  <script src="/scripts/patchnotes.js"></script>
</body>
</html>
