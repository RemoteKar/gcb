<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCB.gg - 랭킹</title>
  <meta property="og:title" content="랭킹 - GCB.gg">
  <meta property="og:description" content="게임캐릭터배틀 유저 랭킹 (MMR)">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <script src="/scripts/character-config.js"></script>
  <script src="/scripts/common.js"></script>
  <main class="page">
    <div class="page-head">
      <h1 class="page-title">랭킹</h1>
      <p class="page-desc">10판 이상 플레이한 유저 · 정식 캐릭터 게임 기준</p>
    </div>
    <section class="podium" id="podium"></section>
    <section class="card">
      <div class="card-head">
        <h2 id="ranking-count">전체 랭킹</h2>
        <input type="search" id="ranking-search" class="input input-sm" placeholder="닉네임 검색" autocomplete="off" aria-label="랭킹에서 닉네임 검색">
      </div>
      <div id="ranking-table" class="table-wrap"><div class="skeleton row"></div><div class="skeleton row"></div><div class="skeleton row"></div></div>
    </section>
  </main>
  <script src="/scripts/stats-table.js"></script>
  <script type="module" src="/scripts/ranking.js"></script>
</body>
</html>
