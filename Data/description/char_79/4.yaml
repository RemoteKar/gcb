id: 파이논4

name: 영원히 타오르는 세상, 그가 짊어지리라

description: "&c[불씨]&f가 &712개&f 이상이면 카스라나로 변신하여 스킬이 교체되고 &a최대체력의 50%&f만큼 체력을 회복합니다\n&f변신 중 다시 시전하면 변신을 해제합니다\n&f해제 시 공중으로 떠올라 마지막 일격으로 주변 적에게 &6250&c(+250% 타격력)&f의 고정 피해를 입히고 일반형으로 돌아옵니다\n&f적에게 치명적인 피해를 받으면 자동으로 해제됩니다\n&f해제 시 &c[불씨]&f를 &72개&f 얻고 &73초&f간 천천히 낙하합니다\n&7해제 범위: 20\n&7변신 시전 시간: 3.75초\n&7[불씨] 소모 개수: 12\n&7재사용대기시간: 10 (고정)"
