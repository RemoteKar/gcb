id: 파이논2

name: 재앙·영혼과 천명의 소멸

description: "&7변신 중에만 사용할 수 있습니다\n&f최대 &75초&f간 방어 태세를 취하여 받는 피해가 추가로 &750%&f 감소합니다 &7(고정 피해 제외)\n&f방어 중에는 해제할 수 없는 비행 상태가 되며 비행 속도가 &b70%&f 느려지고 기본공격을 할 수 없습니다\n&f반격 준비 중에는 공중에 멈추며 공격과 다른 스킬을 사용할 수 없습니다\n&f재시전하거나 지속시간이 끝나면 &70.8초&f 후 전방으로 반격합니다\n&f반격은 &675&c(+75% 타격력)&f에 방어 중 받은 피해의 &640%&f를 더한 물리 피해를 적에게 입힙니다 &7(피해 감소 전 기준)\n&7최소 방어 시간: 1.55초\n&7사거리: 60\n&7범위: 4\n&7재사용대기시간: 16 (방어 태세 종료 시부터)"
