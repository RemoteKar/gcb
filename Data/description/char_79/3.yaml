name: 기둥·죽음의 별의 심판

description: "&7변신 중에만 사용할 수 있습니다\n&f지정한 지점에 운석을 떨어뜨립니다\n&70.55초&f 후부터 &70.1초&f마다 범위 내 적에게 &610&c(+10% 타격력)&f의 물리 피해를 입힙니다\n&f운석이 충돌하면 주변 적에게 &6200&c(+200% 타격력)&f의 물리 피해를 입힙니다\n&f이 스킬 이외의 수단으로 한 번에 &660&f 이상의 피해를 입힐 때마다 이 스킬의 재사용대기시간이 &75초&f 감소합니다\n&7사거리: 20\n&7지속 피해 범위: 16\n&7지속 피해 최대 타격 수: 15\n&7폭발 범위: 16\n&7재사용대기시간: 50"
