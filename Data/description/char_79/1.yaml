id: 파이논1

name: 여명의 창세, 천지를 개벽할지니

description: "&70.6초&f간 준비한 뒤 전방으로 돌진하여 전방의 적들에게 &650&c(+120% 타격력)&f의 물리 피해를 입힙니다\n&f적에게 적중하면 시전당 한 번 &c[불씨]&f를 &712개&f 얻습니다\n&7(1~3번 슬롯의 재사용대기시간을 공유합니다)\n&7돌진 거리: 5\n&7범위: 16 (160도)\n&7재사용대기시간: 5\n\n창생·피 묻은 가시의 장송&f\n&f지정한 적을 고정시키고 빠르게 돌진합니다\n&70.5초&f 후 전방을 찔러 적들에게 &6125&c(+125% 타격력)&f의 물리 피해를 입히고 밀쳐내며 &70.5초&f간 기절시키고 뒤로 물러납니다\n&7사거리: 10\n&7찌르기 범위: 6\n&7재사용대기시간: 4"
