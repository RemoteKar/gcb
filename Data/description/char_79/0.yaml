name: 이 몸을 횃불 삼아

description: "&f받는 피해가 &710%&f 감소합니다 &7(고정 피해 제외)\n&f적에게 한 번에 &680&f 이상의 피해를 받으면 &c[불씨]&f를 &71개&f 얻습니다\n&c[불씨]&f가 &712개&f 이상이면 피격으로 불씨를 얻지 않습니다\n&7[불씨] 최대 보유 개수: 15\n\n&f변신 중에는 받는 피해 감소량이 &715%&f로 늘어나고 피격으로 &c[불씨]&f를 얻지 않습니다\n&f변신 중 궁극기를 제외한 스킬을 시전할 때마다 사용 횟수를 소모하고 &a잃은 체력의 10%&f를 회복합니다\n&f사용 횟수를 모두 소모하거나 변신 후 &7100초&f가 지나면 자동으로 변신이 해제됩니다 &7(스킬 동작 중이면 끝난 뒤)\n&f변신 중 스킬 동작 중에는 다른 변신형 스킬을 사용할 수 없습니다\n&7변신 중 스킬 사용 횟수: 12"
