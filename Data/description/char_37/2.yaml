id: 아처2

name: 투영

description: "&f스킬이 다음에 시전할 스킬들로 변합니다\n&b[2-1]&e적원렵견 - 흐룬팅: \n&f대상을 추적하는 마검을 투척합니다\n&f마검은 목표를 관통해 &630&6(+25% 추가 공격력)&c(+35% 타격력)&f의 피해를 입히고 지나갑니다\n&7최대 타격 수: 6\n&7사거리: 300\n&7재사용대기시간: 12\n\n&b[2-2]&e거짓 나선검 - 칼라드볼그: \n&f마검을 화살로 변형시킨 후 발사합니다\n&f경로상의 적에게 &6120&6(+120% 추가 공격력)&c(+200% 타격력)&a(+대상 최대체력의 30%)&f의 고정 피해를 입힙니다\n&7사거리: 300\n&7재사용대기시간: 20\n\n&b[2-3]&e영구히 아득한 황금의 검 - 엑스칼리버: \n&f불완전한 성검을 투영해냅니다\n&f전방 경로상의 적에게 &6100&c(+500% 타격력)&f의 고정피해를 줍니다\n&f사용 후 투영을 사용 할 수 없게됩니다\n&7사거리: 100\n&7재사용대기시간: 50"
