name: 로켓 펀치

description: "&f충전하며 돌진할 준비를 하며 최대 &71.6초&f간 집중하여 &71초&f후 최대로 충전됩니다\n&f재시전시 돌진하며 부딪힌 대상을 충전한 시간에 비례하여 &630(+50% 추가 공격력)~60(+150% 추가 공격력)&f의 피해를 주고 밀어냅니다\n&f밀려난 적은 지형에 충돌할 시 &6밀어낸 피해의 125%&f의 피해를 입습니다\n&b충전&f된 상태에서는 돌진속도,넉백거리,피해량이 &650%&f상승하고 &70.75초&f 기절시킵니다\n&7사거리: 6~24\n&7넉백거리: 8~30\n&7재사용대기시간: 5"
