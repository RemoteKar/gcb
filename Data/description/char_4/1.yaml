name: 전격 폭발

description: "&f전기 구체를 발사해 처음 적중한 적과 주변 모든 적에게 &660(+150% 추가 공격력)&f의 피해를 입힙니다\n&f전기 구체가 가속 관문을 통과하면 구체의 범위가 상승하며\n&f사거리,이동 속도,피해량이 &650%&f증가합니다\n&7사거리: 90\n&7범위: 2, 5\n&7재사용대기시간: 8\n\n하늘로!&f\n&f전방으로 도약하고 착지시 주변 적들에게 &650(+135% 추가 공격력)&f의 피해를 입힙니다\n&f피해를 받은 적은 &72초&f 간 &b50%&f 둔화됩니다\n&7범위: 6\n&7재사용대기시간: 6"
