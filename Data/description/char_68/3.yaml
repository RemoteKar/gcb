id: 엘렌3

name: 사냥 순행

description: "&f시전즉시 &71초&f간 대상으로 지정할수 없게됩니다\n&f이후 &720초&f간 이동속도가 &b40%&f 상승하며 전방으로 질주합니다\n&f지속시간도중 재시전시 &b[살얼음 잠습]&f을 시전합니다\n&7이동명령을 입력하지 않을 시 종료됩니다\n\n&b살얼음 잠습:\n&f돌진하며 주변 적을 베어 &70.6초&f 기절시키고 &650% 공격력&f의 피해를 주며 밀어냅니다\n&f이후 &70.7초&f간 가위질 공격을 충전합니다\n&f재시전하거나 충전완료시 돌진하며 전방에 &675% 공격력(+대상이 잃은 체력의 10%)&f의 피해를 줍니다\n&f피해량은 충전시간에 비례하여 &63배&f까지 상승합니다\n&7범위: 5\n&7재사용대기시간: 6"
