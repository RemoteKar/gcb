name: 사격

description: "&f스킬이 다음에 시전할 스킬들로 변합니다\n&b4번&f스킬을 눌러 종료 할 수 있습니다\n&7재사용대기시간: 7\n&b[2-1]&e더블배럴: &f전방에 빠르게 두번 사격하여 각각&6125&f의 피해를 줍니다\n&7사거리: 20\n\n&b[2-2]&e겟 온 파이어: &73번&f 사격합니다 첫 두발은 각각 &640&f의 피해를 주며, 사격후 이동방향으로 돌진합니다\n&f마지막 탄환은 전방 모든적에게 &6120&f의 피해를 줍니다\n&7사거리: 40\n\n&b[2-3]&e더 나인 베럴: &70.9초&f간 집중 후 전방에 있는 모든 적에게 &6150&f의 피해를 줍니다\n&7사거리: 60"
