name: 무기

description: "볼트라이플&f폭발하는 탄환을 발사하는 라이플입니다\n&f적중시 &630% 공격력&f의 피해를 입히고 &625%&f의 적중시 발생효과를 적용합니다\n&7연사속도: 4\n&7탄속: 240\n&7재장전시간: 1.5\n체인소드&f빠른 공격이 특징인 무기입니다\n&f유형: &7한손\n&f공격속도: &e빠름\n&f공격피해: &675% 공격력\n&f점프공격피해: &6100% 공격력\n파워소드&f콤보 공격으로 적을 공격합니다\n&f각 콤보마다 피해량이 &660%&f증가합니다\n&f유형: &7한손\n&f공격속도: &e중간\n&f공격피해: &660% 공격력\n&f점프공격피해: &6125% 공격력\n썬더해머&f강력한 공격이 특징입니다\n&f마지막 공격은 &6대상 최대체력의 12%&f의 추가피해를 입힙니다\n&f유형: &7양손\n&f공격속도: &e느림\n&f공격피해: &6100% 공격력\n&f점프공격피해: &6200% 공격력"
