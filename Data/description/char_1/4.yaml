id: 요우무4

name: 인귀「미래영겁참」

description: "&f방어자세를 취해 &75초&f 간 &b100&c(+100% 타격력)&f의 보호막을 얻고 영역 내로 들어오는 투사체를 모두 방어합니다\n&f영역은 점점 크기가 증가하며 투사체를 방어할때마다 더 빨리 크기가 증가합니다\n&f지속시간 종료,재사용시 영역 내에 바라보는 대상에게 이동한 다음\n&f주변의 모든 적에게 &6150&6(+300% 공격력)&f의 피해를 줍니다\n&7영역 내에 대상이 될수있는 적이 없으면 공격하지않으며 절반의 재사용대기시간이 적용됩니다\n&7영역범위: 10~45\n&7공격범위: 20\n&7재사용대기시간: 90"
