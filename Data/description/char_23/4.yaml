name: 궁극기선택

description: "&f궁극기중 하나를 선택합니다\n도발\n&f최대체력이 &a300&f 증가합니다\n&f대상에게 매우 심한 말을 해서 도발하여 &73초 &f동안 기절시킵니다\n&7사거리: 6\n&7재사용대기시간: 30\n\n거인의 강타\n&f최대체력이 &a100&f 감소합니다&f\n&f공격력이 &640&f 증가합니다\n&f힘차게 대상 적에게 돌격하고 강타하여 &6120(+150% 공격력)&f의 피해를 줍니다\n&f피해를 받은 대상은 &76초&f 간 방어력이 &650&f 감소합니다\n&7사거리: 16\n&7재사용대기시간: 30\n\n분노의 쌍검\n&f공격속도가 &e400%&f 증가합니다\n&f공격력이 &610&f 감소합니다\n&b기본 지속효과:\n&e영웅의 일격&f 의 재사용대기시간 감소율이 추가로 &73초 &f증가합니다\n&f기본공격을 할때마다 이동속도가 &72초&f 동안 &b50%&f 증가합니다\n&b사용시:\n&76초&f 간 공격속도가 &e100%&f 상승합니다\n&7재사용대기시간: 30"
