id: 잇카쿠1

name: 삼찰의 자세

description: "&f시해를 해방하며 자세를 취합니다\n&f스킬이 변경되며 &73회&f 사용 시 종료됩니다\n&f기본 공격 사거리가 &6100% &f증가합니다\n&f공격력이 &630% &f증가합니다\n&f공격 속도가 &c50% &f감소합니다\n&b4번&f스킬을 눌러 종료 할 수 있습니다\n&7재사용대기시간: 6\n&b[2-1]&e섬격: &f돌진하며 &655(+100% 추가 공격력)&f의 피해를 줍니다\n&b삼찰의 자세&f 마지막 공격으로 사용 시\n&630(+80% 추가 공격력)(+대상이 잃은 체력의 20%)&f의 피해가 추가됩니다\n\n&b[2-2]&e속격: &f전방을 찔러 &630(+85% 추가 공격력)&f의 피해를 주고 &70.5초&f 동안 기절시킵니다\n&f남은 &b삼찰의 자세&f 갯수에 비례해 &610(+20% 추가 공격력)&f의 피해를 추가로 줍니다\n&7사거리: 12\n\n&b[2-3]&e백격: &f뒤로 물러나며 &610(+50% 추가 공격력)(+대상의 최대 체력의 12%)&f의 피해를 줍니다\n&f적중한 적은 넉백당하며, 자신은 지정불가 및 저지불가 상태를 얻습니다\n&7범위: 7"
