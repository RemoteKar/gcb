name: 특성선택

description: "&f적 처치시마다 카라짐의 스킬이 하나식 강화되어 순서대로 다음 특성을 얻습니다\n&7천지권법\n&7천상의 메아리\n&7삼매경\n&7단죄\n&7전설의주먹\n\n&73번&f째 기본공격마다 이동속도가 &72초&f간 &b50%&f 증가하고 다음 효과가 발동합니다\n&a초월&f\n&f최대체력의 &a8%&f를 회복합니다\n&6철권&f\n&f다음 기본공격이 &6160%&f의 피해를 입힙니다\n&b통찰&f\n&f스킬의 재사용대기시간이 &b2초&f 감소합니다\n\n&b전설의주먹:\n&f선택하지 않은 다른 두 특성을 &750%&f의 효과로 얻습니다"
