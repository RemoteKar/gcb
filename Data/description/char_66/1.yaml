name: 무릎차기

description: "&b웅크리고 시전시:\n&f위로 돌진하며 전방 대상을 올려차 &670&f의 피해를 입히고 &72초&f 기절시킨뒤 대상을 위로 띄웁니다\n&7범위: 3\n\n&f전방으로 돌진하여 적중하는 대상에게 &670&f의 피해를 입히고 &70.5초&f 기절시키고 밀어냅니다\n&a돌진한 거리에 따라 다음 부가효과를 얻습니다\n&74거리 이하: &f적중시 재사용대기시간 감소율이 &775%&f로 증가합니다\n&74거리 이상: &f기절시간이 &71초&f로 증가합니다\n&78거리 이상: &f피해량이 &6210&f으로 상승합니다\n&c지형에 충돌할 시 스스로 &6피해량의 50%&c의 피해를 입습니다\n&7사거리: 12\n&7넉백: 4\n&7재사용대기시간: 6"
