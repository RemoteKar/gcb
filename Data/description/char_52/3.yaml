id: 쇼이치3

name: 협상

description: "&f전방으로 단검을 던져 적중한 적에게 &680&c(+40% 타격력)&f의 피해를 주고\n&71.5초&f간 &b50%&f 둔화시킵니다\n&f적중한 적에게 &75초&f 동안 협상 표식을 부여하고 적의 뒤쪽에 단검을 남기며, 빗나가면 멈춘 곳에 단검을 남깁니다\n&f표식 대상은 던져진 단검으로 받는 피해가 &625%&f 증가하며, 단검에 맞을 때마다 재사용대기시간이 &71초&f 감소합니다\n&f표식 대상이 사망하면 재사용대기시간이 &790%&f 감소합니다\n&f부당거래는 협상 표식이 남은 적을 우선하여 공격합니다\n&7사거리: 30\n&7재사용대기시간: 16"
