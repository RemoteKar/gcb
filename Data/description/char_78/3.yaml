id: 노르마3

name: 웅나 포탑

description: "&f전방에 체력 &a150&f의 포탑을 설치하고, 위로 올라가 &75초&f 동안 탑승합니다\n&f탑승 중에는 포탑의 공격속도가 &7300%&f 증가하고 시야 방향으로 사격합니다\n&f그로기가 발동하면 모든 포탑, 이후 그로기 상태의 적을 탐지한 포탑의 공격속도가 &7300%&f 증가합니다 &7(6초, 포탑마다 그로기당 1회, 탑승과 중첩되지 않음)\n&f총알은 발당 &65&6(+5% 추가 공격력)&f의 피해를 주고, 전방 대상에게 발사하는 추적 미사일은 &620&6(+50% 추가 공격력)&f의 피해를 줍니다\n&f미사일이 적중하면 &72초&f간 중첩을 쌓고, &73중첩&f이 되면 대상을&70.6초&f간 기절시킵니다\n&f재시전하거나 웅크리기 키를 누르거나 탑승 시간이 끝나면 뒤로 내려오며, 포탑은 남아서 주변 적을 자동 공격합니다\n&f포탑은 노르마의 공격 대상을 우선 공격합니다\n&7지면 위에서만 사용할 수 있습니다\n&7포탑 지속시간: 40초 / 최대 2개, 초과 시 오래된 포탑부터 제거\n&7기관총 사거리: 30 / 미사일 사거리: 45\n&7재사용대기시간: 15"
