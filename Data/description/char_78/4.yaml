description: "&f조준한 지점에 연속 로켓 &77발&f을 일정한 배열로 떨어뜨려 각각 &630&6(+37.5% 추가 공격력)&f의 피해를 줍니다\n&f마지막에 중심으로 대형 미사일을 떨어뜨려 &6120&6(+150% 추가 공격력)&f의 피해를 줍니다\n&f미사일에 적중한 대상은 &72초&f 기절합니다\n&f대형 미사일은 대상의 그로기 수치를 &750%&f 증가시킵니다\n&7여러 로켓에 적중하면 각각 피해를 받습니다\n&7사거리: 60\n&7폭발 범위: 소형 5 / 대형 20\n&7재사용대기시간: 90"
