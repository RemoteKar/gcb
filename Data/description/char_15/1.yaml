name: 저격

description: "&f적중한 대상에게 &650&6(+50% 추가 공격력)&c(+50% 타격력)&f의 피해를 주는 탄환을 발사합니다\n&f적에게 적중하면 재사용대기시간이 &750%&f감소합니다\n&f적 플레이어에게 적중시 다음 저격의 피해량이 &620%&f 증가하여 최대 &6100%&f 증가합니다\n&c아무것도 맞히지 못하면 모든 중첩을 잃습니다\n&f\n&b부동조준:\n&f조준후 사용시 피해량이 &6고정피해&f로 전환되는 대신 &70.5초&f간 집중 후 발사하며\n&a대상이 잃은체력&f에 비례해 피해량이 최대 &6100%&f 증가합니다\n&7재사용대기시간: 8"
