name: 특수 무기 사용

description: "&f스킬이 다음에 시전할 스킬들로 변합니다\n&b4번&f스킬을 눌러 종료 할 수 있습니다\n&7재사용대기시간: 12\n&b[2-1]&e레이저 라이플: &f레이저 라이플을 충전합니다 레이저는 &660&c(+120% 타격력)&f의 피해를 줍니다\n&f최대로 충전할 시 레이저의 피해량이 &650%&f 폭이 &7100%&f 증가합니다\n&7사거리: 100\n\n&b[2-2]&eFM-92 스팅어: &f대상 지점의 상공으로 유탄을 발사합니다\n&f발사된 유탄은 목표 위치 도달시 &710발&f의 자탄을 투하합니다\n&f각 자탄은 지면에 닿으면 폭발하며 범위 내의 적에게 &670&c(+70% 타격력)&f의 피해를 줍니다\n&7범위: 7\n&7사거리: 128\n\n&b[2-3]&e양자폭탄: &76초&f 간 자유시점 상태가 되며 바라보는 위치를 조준합니다\n&f아무스킬이나 시전시 자유시점 상태가 종료되며 해당 위치로 양자폭탄을 투하합니다\n&f양자폭탄은 &71초&f 이후 폭발하여 주변에 &6100&c(+150% 타격력)&f 의 피해를 줍니다\n&7사거리: 160\n&7범위: 15"
