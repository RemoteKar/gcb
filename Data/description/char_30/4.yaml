id: 사쿠야4

name: 「사쿠야의 세계」

description: "&f사용하면 주변 적에게 표식을 남겨 &b20%&f 둔화시키고, 표식이 남은 적에게 준 피해를 쌓습니다\n&710초&f간 전개와 수납 효과를 모두 받고 이동속도가 &b20%&f 증가합니다\n&f끝나거나 재사용하면 표식이 남은 적에게 차례로 순간이동해 &675&6(+쌓인 피해의 30%)&f의 고정피해를 입힙니다\n&f체력이 이 피해 이하로 떨어진 적은 즉시 처형하고, 처치하면 재사용대기시간의 &740%&f를 돌려받습니다\n&7범위: 15\n&7재사용대기시간: 140"
