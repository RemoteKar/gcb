id: 사쿠야2

name: 환장「밤안개의 환영살인귀」

description: "&f회전하며 돌진해 부딪힌 적을 &70.5초&f간 고정시키고 &630&6(+60% 추가 공격력)&c(+30% 타격력)&f의 피해를 입힙니다\n&f돌진이 끝나면 나이프를 던집니다 &7(돌진 중 재사용하면 바로 멈추고 던집니다)\n&c빨강: &f돌진에 맞은 적을 쫓아가는 나이프 &73&e(추가 공격속도 30%당 +1)&7개&f를 던져 각각 &63&6(+18% 추가 공격력)&c(+12% 타격력)&f의 피해를 입힙니다\n&9파랑: &f나이프 &75&e(추가 공격속도 25%당 +1)&7개&f를 산탄처럼 모아 던져 각각 &66&6(+18% 추가 공격력)&c(+12% 타격력)&f의 피해를 입힙니다\n&7돌진 거리: 20\n&7나이프 사거리: 40\n&7재사용대기시간: 18"
