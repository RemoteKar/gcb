id: 사쿠야0

name: 시간을 조종하는 정도의 능력

description: "&f시간이 멈춘 적에게 주는 피해가 &6100%&f 증가합니다\n&f시간이 멈춰도 스킬과 기본공격을 쓸 수 있습니다\n&b[Q]&f 시계를 전개하거나 수납합니다\n&e전개: &f기본공격·스킬로 공격한 적의 시간을 &70.25초&f간 멈춥니다 &7(같은 적은 5초에 한 번)\n&e수납: &f기본공격·스킬로 적을 맞힐 때마다 스킬 재사용대기시간이 &70.15초&f 줄어듭니다\n&7[우클릭]&f 나이프 색을 바꿉니다\n&c빨강: &f조준한 적을 쫓아가는 나이프 &72&e(추가 공격속도 80%당 +1)&7개&f를 던져 각각 &620% 공격력&f의 피해를 입힙니다\n&9파랑: &f적을 꿰뚫고 벽에 튕기는 나이프 &73&e(추가 공격속도 55%당 +1)&7개&f를 던져 각각 &615% 공격력&f의 피해를 입힙니다\n&f튕길 때마다 피해가 &610%&f 증가합니다 &7(최대 5번)\n&7(적중 효과와 경직은 대상마다 처음 맞은 나이프 하나에만 적용됩니다)"
