name: 전묘 / 금기 깨는 호락

description: "&f대상의 반대편 혹은 대상 지면으로 순간이동합니다\n&f이동 후 &71초&f내에 재시전하여 &b[금기 깨는 호락]&f을 시전 할 수 있습니다\n\n&b[금기 깨는 호락]\n&f위로 도약하며 주변 적을 공중으로 띄우며 &75번&f 공격합니다\n&f적중당한 대상은 총 &640&6(+120% 공격력)&f의 피해를 입습니다\n&b[은폐나이프]&f 적중시 이 스킬의 재사용 대기시간이 초기화 됩니다\n&7유닛 대상 사거리: 30\n&7지면 대상 사거리: 20\n&7범위: 4\n&7재사용대기시간: 18"
